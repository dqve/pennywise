name: Import Pennywise MVP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-pennywise.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize source archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_1: d93c80350d05ee277d3e087c6397b97333c5922a
          ARCHIVE_2: b2ab476a633aa7e08f49bb5196862c9136e32d49
          ARCHIVE_3: cd91bc3f3ca06294aa1a5cc0d6b2c902b2034ad7
          ARCHIVE_4: 07d582121b84e85ebb5edd5d36b4675b82f2ef43
          ARCHIVE_5: b6c48afb421160ce4a3b9169655b565e8a922a7c
          ARCHIVE_6: 4cc254f2945aa9ff3a5912dd170d2c71d4e53dd6
        run: |
          set -euo pipefail
          rm -f /tmp/pennywise.tar.gz

          for sha in "$ARCHIVE_1" "$ARCHIVE_2" "$ARCHIVE_3" "$ARCHIVE_4" "$ARCHIVE_5" "$ARCHIVE_6"; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$sha" --jq '.content' \
              | tr -d '\n' \
              | base64 --decode >> /tmp/pennywise.tar.gz
          done

          mkdir -p /tmp/pennywise-extract
          tar -xzf /tmp/pennywise.tar.gz -C /tmp/pennywise-extract

          # Replace repository contents with the verified source tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/pennywise-extract/. .

          rm -f .github/workflows/import-pennywise.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          test -f package.json
          test -f app/page.tsx
          test -f lib/domain.ts
          test -f db/schema.sql
          test -f docs/TRACEABILITY.md
          test -f tests/domain.test.ts
          test -f fixtures/statement.pdf

      - name: Commit Pennywise MVP
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Push Pennywise governed MVP"
          git push origin HEAD:main
