name: Pennywise quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Local persistence and isolation checks
        run: npm run verify
        env:
          PENNYWISE_DB_PATH: /tmp/pennywise-ci.sqlite
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
