name: Pennywise quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pennywise_ci_password
          POSTGRES_DB: pennywise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pennywise_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pennywise-npm-lockfile-upgraded
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: PostgreSQL RLS integration tests
        run: npm run test:postgres
        env:
          DATABASE_URL: postgres://pennywise_test_runtime:pennywise_test_password@localhost:5432/pennywise_ci
          PENNYWISE_TEST_ADMIN_DATABASE_URL: postgres://postgres:pennywise_ci_password@localhost:5432/pennywise_ci
      - name: Unit tests
        run: npm test
      - name: Local persistence and isolation checks
        run: npm run verify
        env:
          PENNYWISE_DB_PATH: /tmp/pennywise-ci.sqlite
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
